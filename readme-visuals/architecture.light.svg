<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1312" viewBox="0 0 800 1312" role="img" aria-labelledby="title desc">
<title id="title">Bombe Studio — 统一导航连接五类学习入口</title><desc id="desc">展馆导航: 学生可从导航自由选择历史、展品、实验、挑战或故事任务。. 战时序章: 提供历史背景、人物接力和科技发展线索。. 机械全貌: 展示 Bombe 的整机、部件和可拆解结构。. 信号实验室: 让学生操作轮位、接线和字母输入，逐段观察信号路径。. 解密挑战: 通过分关任务练习观察、操作和推理。. 黎明之前: 以夜班分析员身份，在连续任务中完成证据判断和情报交接。</desc>
