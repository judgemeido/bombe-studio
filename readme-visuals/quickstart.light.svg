<title id="title">Bombe Studio — 三步打开项目</title><desc id="desc">准备运行环境: 项目要求 Node.js 22 或更新版本。 — node --version. 安装项目依赖: 在项目根目录安装锁定版本的依赖。 — npm.cmd ci. 启动并打开展馆: 启动本地开发服务后，在浏览器打开项目首页。 — npm.cmd run dev</desc>
