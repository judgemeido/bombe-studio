<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1032" viewBox="0 0 800 1032" role="img" aria-labelledby="title desc">
<title id="title">Bombe Studio — 从科学主题到可操作体验</title><desc id="desc">课程主题: 以 Bombe、Enigma 和密码破译历史为示例，也可替换为其他科学与工程主题。. 模型、实验与任务: 三维模型、虚拟实验和角色任务把结构、规律与故事转成学生可操作的过程。. 学生学习体验: 学生观察、操作、验证和推演，在同一展馆中完成从理解到应用的学习过程。</desc>
